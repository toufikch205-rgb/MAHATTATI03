name: Restore MAHATTATI project files from archive

on:
  push:
    paths:
      - "MAHATTATI2-phase7-ride-acceptance.zip"

permissions:
  contents: write

jobs:
  restore-project:
    if: "!contains(github.event.head_commit.message, '[skip unzip]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project files
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("MAHATTATI2-phase7-ride-acceptance.zip")
          with zipfile.ZipFile(archive) as z:
              root = "MAHATTATI2-main/"
              for item in z.infolist():
                  if item.is_dir() or not item.filename.startswith(root):
                      continue
                  relative = item.filename[len(root):]
                  if not relative:
                      continue
                  target = Path(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item.filename))
          PY
          rm -f MAHATTATI2-phase7-ride-acceptance.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip unzip] Restore complete MAHATTATI project files from provided archive"
            git push origin HEAD:main
          fi
